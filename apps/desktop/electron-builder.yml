# Packaging for Linux and Windows.
#
# `files` is only the build output and the manifest, with no node_modules entry,
# because there is nothing to carry: electron.vite.config.ts bundles the three
# workspace packages, so the built main process imports nothing but `electron`
# and `node:*` builtins. That is what keeps this file short — in a monorepo the
# usual pain is teaching the packager which symlinks to follow.
appId: io.github.cody_young.mplus-logs

# Set explicitly rather than left to default. electron-builder falls back to the
# package `name` for the executable, and this package is named `@mplus/desktop`
# — which it sanitises to `@mplusdesktop`, the exact string the README says the
# window must never announce itself as.
productName: mplus-logs

# NOT changed to a prettier "M+ Logs": productName in package.json is what gives
# the window its WM_CLASS / Wayland app_id, Electron reads it before the main
# script runs, and the README documents the name users write window rules
# against. The installers get readable names through artifactName instead.
# The packaged manifest's `name`, which is `@mplus/desktop` and has the same
# problem `productName` did. electron-updater's cache directory is
# `sanitize(name) + "-updater"`, and there is no option for it — so left alone
# the updater creates `@mplusdesktop-updater` next to the app's own data, in
# `%LOCALAPPDATA%` on Windows. Overriding the name here is the only lever:
# electron-builder merges `extraMetadata` into the metadata before it derives
# any of those paths. `app.getName()` is unaffected, because Electron reads
# `productName` first and that is already right.
extraMetadata:
  name: mplus-logs

directories:
  output: ../../release
  buildResources: build

files:
  - out/**
  - package.json

asar: true

# There is nothing to rebuild or install: no native modules, and after the
# bundling in electron.vite.config.ts no production dependencies at all. Left
# on, electron-builder shells out to app-builder to "install production
# dependencies" before every package, which is work this app never needs.
npmRebuild: false

# Pinned because electron-builder infers the version from the dependency tree,
# and in a workspace the install is hoisted to the repo root where its usual
# lookup does not reach.
#
# It has to agree with the `electron` devDependency, which is why that one is
# pinned exactly rather than carrying a caret: a range free to drift to 33.5.x
# would have electron-builder package a binary that is not the one `npm ci`
# installed.
electronVersion: 33.4.11

# The default, and the final word for the Linux targets: AppImage and deb differ
# in ${ext}, so those two cannot collide. Both Windows targets build a .exe and
# so do collide under this template — see the per-target names further down.
#
# ${productName} would be the WM_CLASS name; ${name} is the same string here.
# ${version} and ${arch} are what make two releases distinguishable on disk.
artifactName: mplus-logs-${version}-${os}-${arch}.${ext}

linux:
  # Utility rather than Game: it never launches anything, it reads a text file
  # the game wrote, and it belongs in a menu beside the other log viewers.
  category: Utility
  # .deb refuses to build without one, and it is written into the package for
  # anyone who installs it — so a GitHub noreply rather than a personal address.
  maintainer: Cody Young <cody-young@users.noreply.github.com>
  executableName: mplus-logs
  synopsis: Combat log analysis for Mythic+ keys
  target:
    - AppImage
    - deb

win:
  target:
    - nsis
    - portable

# A name each, because both of the targets above emit a .exe. Left to the shared
# template they resolve to the same path, and the packaging log reads as success
# the whole way: the portable build quietly overwrites the installer on disk,
# then the publisher queues two uploads under the one asset name and the second
# deletes and re-pushes 110 MB, which is what GitHub's uploader gave up on with
# a 408. Nothing in the build was wrong, so nothing in the build said so.
#
# The suffix earns its place on the download page too — an installer and a
# portable build are not interchangeable, and the old names did not say which
# was which.
nsis:
  artifactName: mplus-logs-${version}-${os}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

portable:
  artifactName: mplus-logs-${version}-${os}-${arch}-portable.${ext}

# Creates a draft release on the tag, so a build is reviewed and its notes
# written before anyone can download it.
#
# This is also what points the updater at its feed: the same block is written
# into the app's `app-update.yml`, and `electron-updater` reads the release
# list from there. `releaseType` is a publishing option only — the client side
# resolves the newest release through the public `releases.atom` feed, which
# does not list drafts. So a tag alone ships nothing to anyone: until the draft
# release is published, every installed copy correctly sees no update.
publish:
  provider: github
  releaseType: draft

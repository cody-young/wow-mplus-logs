name: Release

on:
  push:
    tags: ['v*']
  # So a packaging change can be proved on a branch without burning a tag.
  # Artifacts are uploaded to the run; nothing is published.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Windows failing should not deny you the Linux build, and vice versa.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: --linux
          - os: windows-latest
            platform: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Not --ignore-scripts: electron's postinstall is what fetches the binary
      # electron-builder packages. The repo's allowScripts list covers it.
      - run: npm ci

      - name: Build
        run: npm run build

      # Temporary: the packaging step fails on both runners with ENOENT on
      # app-builder's platform binary, which a clean `npm ci` reproduces
      # nowhere locally. This says whether the package arrived incomplete.
      - name: Diagnose app-builder-bin
        shell: bash
        run: |
          npm -v
          echo "--- package dir ---"
          ls -la node_modules/app-builder-bin/ || echo "MISSING package"
          echo "--- linux/x64 ---"
          ls -la node_modules/app-builder-bin/linux/x64/ || echo "MISSING linux/x64"
          echo "--- win/x64 ---"
          ls -la node_modules/app-builder-bin/win/x64/ || echo "MISSING win/x64"
          echo "--- resolved ---"
          node -e "console.log(require.resolve('app-builder-bin'))" || true

      - name: Package
        working-directory: apps/desktop
        run: npx electron-builder ${{ matrix.platform }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The installers are attached to the draft release on a tag; this is so a
      # workflow_dispatch run still produces something to download and try.
      - uses: actions/upload-artifact@v4
        with:
          name: mplus-logs-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
          if-no-files-found: error
          retention-days: 14

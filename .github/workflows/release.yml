name: Release

on:
  push:
    tags: ['v*']
  # So a packaging change can be proved on a branch without burning a tag.
  # Artifacts are uploaded to the run; nothing is published.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Windows failing should not deny you the Linux build, and vice versa.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: --linux
          - os: windows-latest
            platform: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # electron-builder names and publishes by the manifest version, never by
      # the tag, so a tag that disagrees with the manifest does not fail — it
      # quietly uploads the manifest's artifacts into the manifest's release.
      # `v0.1.1` against a 0.1.0 manifest went to the v0.1.0 draft and tried to
      # overwrite the assets already sitting there. Four minutes of Windows
      # packaging is a long way to go to find that out.
      - name: Tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          manifest=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$manifest" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $manifest"
            exit 1
          fi

      # Not --ignore-scripts: electron's postinstall is what fetches the binary
      # electron-builder packages. The repo's allowScripts list covers it.
      - run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        working-directory: apps/desktop
        run: npx electron-builder ${{ matrix.platform }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The installers are attached to the draft release on a tag; this is so a
      # workflow_dispatch run still produces something to download and try.
      - uses: actions/upload-artifact@v4
        with:
          name: mplus-logs-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
          if-no-files-found: error
          retention-days: 14
